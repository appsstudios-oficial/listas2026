<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lista</title>
</head>
<body>

    <div id="pantalla">
        <h1>Cargando en: <span id="contador">5</span></h1>
    </div>

    <div id="contenido" style="display:none;">
        <h3>Copiar lista</h3>
        <p>https://raw.githubusercontent.com/appsstudios-oficial/listas2026/refs/heads/main/junio2026.m3u</p>
    </div>

    <script>
        var seg = 5;
        var elContador = document.getElementById('contador');
        
        var intervalo = setInterval(function() {
            seg--;
            elContador.innerHTML = seg;
            
            if (seg <= 0) {
                clearInterval(intervalo);
                document.getElementById('pantalla').style.display = 'none';
                document.getElementById('contenido').style.display = 'block';
            }
        }, 1000);
    </script>

</body>
</html>
